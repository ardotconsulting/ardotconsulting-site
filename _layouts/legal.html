---
layout: default
---

<article class="post-page">
  <div class="container">
    <header class="post-page-header">
      <h1>{{ page.title }}</h1>
      <p class="post-description">Last updated {{ page.updated | date: "%B %-d, %Y" }}</p>
    </header>

    <div class="post-content">
      {{ content }}
    </div>
  </div>
</article>
